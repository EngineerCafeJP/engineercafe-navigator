# Docker Compose for Engineer Cafe Navigator
# Frontend (Next.js) + Backend (FastAPI + LangGraph) + PostgreSQL (local dev)

version: '3.8'

services:
  # PostgreSQL for local development (LangGraph Checkpointer)
  postgres:
    image: postgres:15-alpine
    container_name: engineer-cafe-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: engineer_cafe
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - engineer-cafe-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Frontend service - Next.js
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: engineer-cafe-frontend
    ports:
      - "3000:3000"
    volumes:
      # Hot reload support
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - engineer-cafe-network
    restart: unless-stopped

  # Backend service - FastAPI + LangGraph
  backend:
    build:
      context: ./backend
      target: development
    container_name: engineer-cafe-backend
    ports:
      - "8000:8000"
    volumes:
      # Hot reload support
      - ./backend:/app
      - /app/__pycache__
    environment:
      - PYTHONUNBUFFERED=1
      # Local PostgreSQL for LangGraph Checkpointer
      - SUPABASE_DB_URI=postgresql://postgres:postgres@postgres:5432/engineer_cafe
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - engineer-cafe-network
    restart: unless-stopped

networks:
  engineer-cafe-network:
    driver: bridge

volumes:
  postgres-data:
  frontend-node-modules:
  frontend-next:
  backend-pycache:
