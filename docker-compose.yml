# Docker Compose for Engineer Cafe Navigator
# Frontend (Next.js) + Backend (FastAPI + LangGraph)
#
# Note: For local PostgreSQL (LangGraph Checkpointer), use Supabase CLI:
#   supabase start
# This provides PostgreSQL at localhost:54322
#
# Access from iPad / other devices on the same network:
#   - Open http://<MacBookのIPアドレス>:3000 (e.g. http://192.168.1.10:3000)
#   - Ports are bound to 0.0.0.0 so the host accepts external connections

services:
  # Frontend service - Next.js
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: engineer-cafe-frontend
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      # Hot reload support
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # コンテナ内のAPIルートからバックエンドへはサービス名で参照
      - BACKEND_API_URL=http://backend:8000
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - engineer-cafe-network
    restart: unless-stopped

  # Backend service - FastAPI + LangGraph
  backend:
    build:
      context: ./backend
      target: development
    container_name: engineer-cafe-backend
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      # Hot reload support
      - ./backend:/app
      - /app/__pycache__
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend/.env
    depends_on:
      voicevox:
        condition: service_healthy
      kokoro-tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - engineer-cafe-network
    extra_hosts:
      # Allow connection to Supabase Local PostgreSQL on host
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # VoiceVox TTS Engine (Local) - for STT/TTS integration
  voicevox:
    image: voicevox/voicevox_engine:latest
    container_name: engineer-cafe-voicevox
    ports:
      - "50021:50021"
    environment:
      - CPU_NUM_THREADS=4
    volumes:
      # Model cache persistence
      - voicevox-cache:/root/.cache/voicevox_engine
    networks:
      - engineer-cafe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50021/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Kokoro TTS Engine (Local) - for English TTS
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: engineer-cafe-kokoro-tts
    ports:
      - "8880:8880"
    networks:
      - engineer-cafe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/v1/audio/voices"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  engineer-cafe-network:
    driver: bridge

volumes:
  frontend-node-modules:
  frontend-next:
  backend-pycache:
  voicevox-cache:
