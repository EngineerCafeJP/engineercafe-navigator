name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'
  PYTHON_VERSION: '3.11'
  DEFAULT_FRONTEND_PRODUCTION_ORIGIN: 'https://frontend-delta-six-20.vercel.app'

jobs:
  # Detect which parts changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/voice-e2e-nightly.yml'
            backend:
              - 'backend/**'

  # Frontend: Lint
  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run ESLint
        run: pnpm lint
        working-directory: frontend

  # Frontend: Type Check
  frontend-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run TypeScript type check
        run: pnpm typecheck
        working-directory: frontend

  # Frontend: Build
  frontend-build:
    needs: [changes, frontend-lint, frontend-typecheck]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build Next.js application
        run: pnpm build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'placeholder-google-ai-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder-openai-key' }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}

  # Frontend: Playwright E2E (smoke + reception subset)
  frontend-playwright-e2e:
    needs: [changes, frontend-build]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
        working-directory: frontend

      - name: Run Playwright E2E (smoke + reception)
        run: >-
          pnpm exec playwright test
          e2e/smoke.spec.ts
          e2e/reception-flow.spec.ts
          e2e/webgl-fallback.spec.ts
          --project=chromium
        working-directory: frontend
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'placeholder-google-ai-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder-openai-key' }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}

  # Frontend: Playwright browser voice E2E against live backend
  frontend-playwright-voice-live:
    needs: [changes, frontend-build]
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
        working-directory: frontend

      - name: Validate live backend secret
        shell: bash
        working-directory: frontend
        run: |
          if [[ -z "${BACKEND_API_KEY:-}" ]]; then
            echo "error: BACKEND_API_KEY is required for frontend-playwright-voice-live." >&2
            exit 1
          fi
          echo "voice-live secret check passed"
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}

      - name: Warm up live backend
        shell: bash
        working-directory: frontend
        run: |
          BACKEND_URL="${BACKEND_API_URL:-https://engineer-cafe-backend-639959525777.asia-northeast1.run.app}"
          echo "Probing $BACKEND_URL/health ..."
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "$BACKEND_URL/health" > /tmp/voice-live-health.json; then
              echo "health (attempt $attempt): $(cat /tmp/voice-live-health.json)"
              exit 0
            fi
            echo "cold-start attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "error: backend /health probe failed after 6 attempts" >&2
          exit 1
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}

      - name: Run Playwright E2E (voice live)
        run: >-
          pnpm exec playwright test
          e2e/voice-live.spec.ts
          --project=chromium-voice-live
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_VOICE_LIVE: '1'
          PLAYWRIGHT_VIDEO: 'off'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'placeholder-google-ai-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder-openai-key' }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-voice-live-report
          path: frontend/playwright-report
          retention-days: 14

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-voice-live-test-results
          path: frontend/test-results
          retention-days: 14

  # Backend: Lint
  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff linter
        run: ruff check .
        working-directory: backend

      - name: Check Black formatting
        run: black --check .
        working-directory: backend

  # Backend: Test
  backend-test:
    needs: [changes, backend-lint]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: backend

      - name: Run tests
        run: pytest -m "not ragas and not slow and not e2e" --tb=short -q --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
        working-directory: backend
        env:
          OPENROUTER_API_KEY: "test-key-not-real"
          SUPABASE_URL: "http://test.invalid"
          SUPABASE_KEY: "test-key-not-real"
          SUPABASE_DB_URI: "postgresql://test:test@localhost:0/test"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 30

  # Backend: RAGAS tests (optional, informational only)
  # Only runs on push to main/develop when OPENAI_API_KEY secret is available
  backend-test-ragas:
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evaluation]"
        working-directory: backend

      - name: Run RAGAS tests
        if: env.OPENAI_API_KEY != ''
        run: pytest -m "ragas" --tb=short -q
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: "http://test.invalid"
          SUPABASE_KEY: "test-key-not-real"
          SUPABASE_DB_URI: "postgresql://test:test@localhost:0/test"

  # Backend: E2E tests (optional, informational only)
  # Only runs on push to main/develop when OPENROUTER_API_KEY secret is available
  backend-test-e2e:
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evaluation]"
        working-directory: backend

      - name: Run E2E tests
        if: env.OPENROUTER_API_KEY != ''
        run: pytest -m "e2e" --run-e2e --tb=short -q -x --timeout=300
        working-directory: backend
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: backend/reports/
          retention-days: 30

  # Backend: Deploy to Cloud Run
  # Only runs on push to develop after backend tests pass
  # NOTE: This is an optional deploy job - not included in ci-success gate
  #
  # Deployment strategy:
  #   - develop branch -> Cloud Run (asia-northeast1) with ENVIRONMENT=production
  #
  # IMPORTANT: Use --update-secrets (NOT --set-secrets) to avoid destroying
  # existing secret bindings like API_SECRET_KEY. See CRIT-1 (2026-03-18).
  #
  # TTS services (VoiceVox, Kokoro) are NOT available on Cloud Run.
  # They require dedicated GPU/CPU instances or external API alternatives.
  # The backend will start without TTS; voice endpoints will fail gracefully
  # when TTS_PROVIDER is set to an unsupported value or TTS service is unreachable.
  backend-deploy-staging:
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t asia-northeast1-docker.pkg.dev/aipartner-426616/cloud-run-source-deploy/engineer-cafe-backend:${{ github.sha }} \
            -t asia-northeast1-docker.pkg.dev/aipartner-426616/cloud-run-source-deploy/engineer-cafe-backend:latest \
            --target production \
            -f backend/Dockerfile \
            backend/
          docker push asia-northeast1-docker.pkg.dev/aipartner-426616/cloud-run-source-deploy/engineer-cafe-backend:${{ github.sha }}
          docker push asia-northeast1-docker.pkg.dev/aipartner-426616/cloud-run-source-deploy/engineer-cafe-backend:latest

      - name: Deploy to Cloud Run
        run: |
          FRONTEND_PRODUCTION_ORIGIN="${FRONTEND_PRODUCTION_ORIGIN:-$DEFAULT_FRONTEND_PRODUCTION_ORIGIN}"
          gcloud run deploy engineer-cafe-backend \
            --image asia-northeast1-docker.pkg.dev/aipartner-426616/cloud-run-source-deploy/engineer-cafe-backend:${{ github.sha }} \
            --region asia-northeast1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 8Gi \
            --cpu 4 \
            --concurrency 1 \
            --min-instances 3 \
            --max-instances 10 \
            --cpu-boost \
            --update-env-vars "ENVIRONMENT=production,TTS_PROVIDER=piper,STT_PROVIDER=qwen-primary,STT_LLM_POSTPROCESS=false,QWEN_STT_TIMEOUT=45,QWEN_STT_HEDGE_DELAY_SECONDS=4,QWEN_STT_HEDGE_GRACE_SECONDS=6,STT_PRELOAD_QWEN_PRIMARY=true,HF_HOME=/app/.hf_cache,FRONTEND_PRODUCTION_ORIGIN=${FRONTEND_PRODUCTION_ORIGIN},ALLOWED_ORIGINS=${FRONTEND_PRODUCTION_ORIGIN},FAST_LLM_ENABLED=true,FAST_LLM_PRIMARY_PROVIDER=cerebras,FAST_LLM_PRIMARY_MODEL=google/gemini-3.1-flash-lite-preview,FAST_LLM_FALLBACK_PROVIDER=gemini,FAST_LLM_FALLBACK_MODEL=google/gemini-2.5-flash-lite,FAST_LLM_TERTIARY_PROVIDER=cerebras,CEREBRAS_ENABLED=true,CEREBRAS_FAST_MODEL=gpt-oss-120b,CEREBRAS_REASONING_EFFORT=low,DEEP_REASONING_MODEL=google/gemini-3.1-pro-preview,DEEP_REASONING_FALLBACK_MODEL=google/gemini-2.5-pro" \
            --update-secrets "OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest,CEREBRAS_API_KEY=CEREBRAS_API_KEY:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_KEY=SUPABASE_KEY:latest,SUPABASE_DB_URI=SUPABASE_DB_URI:latest,API_SECRET_KEY=API_SECRET_KEY:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest"
        env:
          FRONTEND_PRODUCTION_ORIGIN: ${{ vars.FRONTEND_PRODUCTION_ORIGIN }}

      - name: Smoke test deployed service
        run: |
          SERVICE_URL=$(gcloud run services describe engineer-cafe-backend --region asia-northeast1 --format="value(status.url)")
          echo "Testing $SERVICE_URL/health ..."
          for i in 1 2 3; do
            HEALTH=$(curl -sf --max-time 30 "$SERVICE_URL/health") && break
            echo "Attempt $i failed (cold start / Qwen model loading?), retrying in 15s..."
            sleep 15
          done
          echo "$HEALTH"
          echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', f'Health check failed: {d}'"

  # Frontend: Vercel deploy is handled by Vercel Deploy Hook (auto-deploy on push).
  # The former CI-based `frontend-deploy-production` job was removed 2026-03-18
  # because Vercel's Deploy Hook integration is sufficient and more reliable.

  # Final status check for branch protection
  ci-success:
    needs:
      - frontend-lint
      - frontend-typecheck
      - frontend-build
      - frontend-playwright-e2e
      - frontend-playwright-voice-live
      - backend-lint
      - backend-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          # Each job result is one of: success, failure, cancelled, skipped.
          # "skipped" is OK — it means the path-filter determined no changes
          # in that area (e.g., backend-only PR skips frontend jobs).
          # We fail on "failure" or "cancelled".
          FAILED=false
          for job_result in \
            "${{ needs.frontend-lint.result }}" \
            "${{ needs.frontend-typecheck.result }}" \
            "${{ needs.frontend-build.result }}" \
            "${{ needs.frontend-playwright-e2e.result }}" \
            "${{ needs.frontend-playwright-voice-live.result }}" \
            "${{ needs.backend-lint.result }}" \
            "${{ needs.backend-test.result }}"; do
            if [[ "$job_result" == "failure" ]] || [[ "$job_result" == "cancelled" ]]; then
              FAILED=true
            fi
          done
          if [[ "$FAILED" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI checks passed (skipped jobs are OK — no changes in that area)"
