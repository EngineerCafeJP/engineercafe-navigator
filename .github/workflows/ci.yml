name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '24.x'
  PNPM_VERSION: '10.12.1'
  PYTHON_VERSION: '3.11'
  DEFAULT_FRONTEND_PRODUCTION_ORIGIN: 'https://frontend-delta-six-20.vercel.app'

jobs:
  # Detect which parts changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dorny/paths-filter@v4.0.1
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'scripts/validate-p0-cloudrun-vercel-timeouts.mjs'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/voice-e2e-nightly.yml'
            backend:
              - 'backend/**'
              - 'infra/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/alpha-live-verification.yml'

  # Frontend: Lint
  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run ESLint
        run: pnpm lint
        working-directory: frontend

  # Frontend: Type Check
  frontend-typecheck:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run TypeScript type check
        run: pnpm typecheck
        working-directory: frontend

  # Frontend/Infra: P0 timeout guard
  frontend-timeout-guard:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Validate Vercel timeout hierarchy
        run: pnpm exec tsx src/__tests__/vercel-timeout-hierarchy.test.ts
        working-directory: frontend

      - name: Run knowledge updater node regression test
        run: pnpm exec tsx --test --import ./src/__tests__/node-test-setup.ts src/__tests__/update-knowledge-base.test.ts
        working-directory: frontend

      - name: Validate P0 Cloud Run/Vercel settings
        run: node scripts/validate-p0-cloudrun-vercel-timeouts.mjs

  # Frontend: Build
  frontend-build:
    needs: [changes, frontend-lint, frontend-typecheck, frontend-timeout-guard]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build Next.js application
        run: pnpm build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'placeholder-google-ai-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder-openai-key' }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}

  # Frontend: Playwright E2E (smoke + reception subset)
  frontend-playwright-e2e:
    needs: [changes, frontend-build]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
        working-directory: frontend

      - name: Run Playwright E2E (smoke + reception)
        run: >-
          pnpm exec playwright test
          e2e/smoke.spec.ts
          e2e/knowledge.spec.ts
          e2e/reception-flow.spec.ts
          e2e/webgl-fallback.spec.ts
          --project=chromium
        working-directory: frontend
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'placeholder-google-ai-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder-openai-key' }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}

  # Frontend: the live-backend voice E2E job (frontend-playwright-voice-live) was removed on
  # 2026-09-27, when the GCP backend was retired for local operation
  # (docs/plans/local-operation-migration-2026-09-27.md).

  # Backend: Lint
  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff linter
        run: ruff check .
        working-directory: backend

      - name: Check Black formatting
        run: black --check .
        working-directory: backend

  # Wave 3 guard: prevent closing refactor issues while source files remain oversized.
  large-file-guard:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check large source files
        run: python3 scripts/check-large-files.py

  # Backend: Test
  backend-test:
    needs: [changes, backend-lint]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: backend

      - name: Run tests
        run: pytest -m "not ragas and not slow and not e2e" --tb=short -q --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
        working-directory: backend
        env:
          OPENROUTER_API_KEY: "test-key-not-real"
          SUPABASE_URL: "http://test.invalid"
          SUPABASE_KEY: "test-key-not-real"
          SUPABASE_DB_URI: "postgresql://test:test@localhost:0/test"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 30

  # Backend: RAGAS contract tests (optional, informational only)
  # Live/provider RAGAS evaluation runs in the dedicated scheduled workflow.
  backend-test-ragas:
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evaluation]"
        working-directory: backend

      - name: Run RAGAS contract tests
        run: |
          pytest \
            tests/evaluation/test_ragas_pipeline.py \
            tests/evaluation/test_ragas_pipeline_timeout_guard.py \
            tests/evaluation/test_ragas_ci_integration.py \
            tests/evaluation/test_multilingual_ragas.py \
            --ignore=tests/evaluation/test_ragas_live.py \
            --ignore=tests/evaluation/test_ragas_phase_b.py \
            -m "not ragas" \
            --tb=short -q
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: "http://test.invalid"
          SUPABASE_KEY: "test-key-not-real"
          SUPABASE_DB_URI: "postgresql://test:test@localhost:0/test"

  # Backend: E2E tests (optional, informational only)
  # Only runs on push when required live E2E secrets are available.
  backend-test-e2e:
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,evaluation]"
        working-directory: backend

      - name: Check backend E2E secrets
        id: e2e_secrets
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_CALENDAR_ICAL_URL: ${{ secrets.GOOGLE_CALENDAR_ICAL_URL }}
        run: |
          set -euo pipefail

          missing_required=()
          for name in OPENROUTER_API_KEY SUPABASE_URL SUPABASE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing_required+=("$name")
            fi
          done

          missing_live_sources=()
          for name in CONNPASS_API_KEY TAVILY_API_KEY GOOGLE_CALENDAR_ICAL_URL; do
            if [[ -z "${!name:-}" ]]; then
              missing_live_sources+=("$name")
            fi
          done

          if (( ${#missing_required[@]} > 0 )); then
            echo "::notice::Skipping backend E2E; missing required GitHub secrets: ${missing_required[*]}"
            echo "required_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "required_ready=true" >> "$GITHUB_OUTPUT"
          fi

          if (( ${#missing_live_sources[@]} > 0 )); then
            echo "::warning::Backend E2E live-source secrets are missing: ${missing_live_sources[*]}. Live-source answer-quality tests will skip instead of reporting quality failures."
            echo "live_sources_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "live_sources_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run E2E tests
        if: steps.e2e_secrets.outputs.required_ready == 'true'
        run: pytest -m "e2e" --run-e2e --tb=short -q -x --timeout=300
        working-directory: backend
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_CALENDAR_ICAL_URL: ${{ secrets.GOOGLE_CALENDAR_ICAL_URL }}

      - name: Skip E2E tests
        if: steps.e2e_secrets.outputs.required_ready != 'true'
        run: echo "Backend E2E skipped because required GitHub secrets are not configured."

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-reports
          path: backend/reports/
          retention-days: 30

  # Backend: the Cloud Run deploy job (backend-deploy-staging) was removed on 2026-09-27
  # together with the GCP project it deployed to (same plan as above).

  # Frontend: Vercel deploy is handled by Vercel Deploy Hook (auto-deploy on push).
  # The former CI-based `frontend-deploy-production` job was removed 2026-03-18
  # because Vercel's Deploy Hook integration is sufficient and more reliable.

  # Final status check for branch protection
  ci-success:
    needs:
      - changes
      - frontend-lint
      - frontend-typecheck
      - frontend-timeout-guard
      - frontend-build
      - frontend-playwright-e2e
      - backend-lint
      - backend-test
      - large-file-guard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          # Each job result is one of: success, failure, cancelled, skipped.
          # "skipped" is OK — it means the path-filter determined no changes
          # in that area (e.g., backend-only PR skips frontend jobs).
          # We fail on "failure" or "cancelled".
          FAILED=false
          for job_result in \
            "${{ needs.frontend-lint.result }}" \
            "${{ needs.frontend-typecheck.result }}" \
            "${{ needs.frontend-timeout-guard.result }}" \
            "${{ needs.frontend-build.result }}" \
            "${{ needs.frontend-playwright-e2e.result }}" \
            "${{ needs.backend-lint.result }}" \
            "${{ needs.backend-test.result }}" \
            "${{ needs.large-file-guard.result }}"; do
            if [[ "$job_result" == "failure" ]] || [[ "$job_result" == "cancelled" ]]; then
              FAILED=true
            fi
          done
          if [[ "$FAILED" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI checks passed (skipped jobs are OK — no changes in that area)"
