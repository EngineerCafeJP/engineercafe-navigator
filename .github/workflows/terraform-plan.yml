name: Terraform Observability

on:
  pull_request:
    branches: [develop]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  TERRAFORM_VERSION: '1.6.6'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'aipartner-426616' }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'asia-northeast1' }}
  TF_VAR_cloud_run_service_name: ${{ vars.CLOUD_RUN_SERVICE_NAME || 'engineer-cafe-backend' }}
  TF_VAR_alert_email: ${{ vars.OBSERVABILITY_ALERT_EMAIL || 'terisuke1115@gmail.com' }}

jobs:
  terraform-plan:
    name: Validate and plan
    if: github.event_name == 'pull_request' || inputs.action == 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform fmt
        run: terraform fmt -check -recursive -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -no-color

  terraform-apply:
    name: Apply
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform fmt
        run: terraform fmt -check -recursive -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -no-color tfplan

