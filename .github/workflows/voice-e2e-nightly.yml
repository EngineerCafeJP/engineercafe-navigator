name: Voice E2E (nightly)

on:
  schedule:
    # 18:17 UTC == 03:17 JST next day.
    # Runs off the critical PR path so Cloud Run cold-start latency never
    # gates developer merges. See docs/plans/alpha-ui-e2e-hardening-2026-04-12.md
    # Proposal 1 for the rationale.
    - cron: '17 18 * * *'
  workflow_dispatch: {}

concurrency:
  group: voice-e2e-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'
  DEFAULT_BACKEND_URL: https://engineer-cafe-backend-639959525777.asia-northeast1.run.app

jobs:
  voice-live:
    name: Live browser voice E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Warm up Cloud Run backend
        shell: bash
        run: |
          BACKEND_URL="${BACKEND_API_URL:-$DEFAULT_BACKEND_URL}"
          echo "Probing $BACKEND_URL/health ..."
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 "$BACKEND_URL/health" > /tmp/health.json; then
              echo "health (attempt $attempt): $(cat /tmp/health.json)"
              exit 0
            fi
            echo "cold-start attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "warning: backend did not return healthy within the retry budget" >&2
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}

      - name: Run voice-live spec
        run: pnpm exec playwright test e2e/voice-live.spec.ts --reporter=line,html
        env:
          CI: 'true'
          PLAYWRIGHT_VOICE_LIVE: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'placeholder-google-ai-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder-openai-key' }}
          NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || 'https://engineer-cafe-backend-639959525777.asia-northeast1.run.app' }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-live-playwright-report
          path: frontend/playwright-report
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-live-test-results
          path: frontend/test-results
          retention-days: 14

      - name: Create failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          gh issue create \
            --title "Nightly voice E2E failed (run ${{ github.run_id }})" \
            --label "ci,voice-e2e,alpha-gate" \
            --body "$(cat <<'BODY'
          Nightly voice-live E2E workflow failed.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **Next steps:**
          1. Download the `voice-live-playwright-report` artifact from the run.
          2. Inspect the trace/video for the failed assertion.
          3. Confirm the Cloud Run backend revision and `/health` status.
          4. Open a hotfix PR if the regression is real; close this issue otherwise.

          Triggered by: `.github/workflows/voice-e2e-nightly.yml`
          BODY
          )"
