name: Alpha Live Verification

on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma-separated suites: stt,v,a,b,c,c-diag,c-127,d,e,h-ui,h,q,m,t,all (h is a compatibility alias for h-ui; c is c-diag)'
        default: 'stt,v,b,c,q,h-ui'
        type: string
      c_ragas_suite:
        description: 'C/RAGAS case suite when suites contains c or all: diagnostic-29 or alpha-127. Explicit c-diag/c-127 suite aliases override this input.'
        default: 'diagnostic-29'
        type: choice
        options:
          - diagnostic-29
          - alpha-127
      timestamp:
        description: 'Stable timestamp marker. Empty uses current UTC time.'
        default: ''
        type: string
      require_deployed_sha_match:
        description: 'Fail unless the live Cloud Run image tag contains the expected backend SHA. Keep true for GO proof.'
        default: true
        type: boolean
      expected_backend_sha:
        description: 'Optional deployed backend SHA to require in the live Cloud Run image. Empty defaults to workflow SHA.'
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: alpha-live-verification-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  PROJECT_ID: aipartner-426616
  REGION: asia-northeast1
  SERVICE_NAME: engineer-cafe-backend
  DEFAULT_BACKEND_URL: https://engineer-cafe-backend-639959525777.asia-northeast1.run.app

jobs:
  alpha-live:
    name: Alpha live verification scripts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install backend evaluation dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[evaluation]"

      - name: Resolve live target
        shell: bash
        env:
          INPUT_EXPECTED_BACKEND_SHA: ${{ inputs.expected_backend_sha }}
          INPUT_REQUIRE_DEPLOYED_SHA_MATCH: ${{ inputs.require_deployed_sha_match }}
          INPUT_TIMESTAMP: ${{ inputs.timestamp }}
        run: |
          set -euo pipefail
          ts="$INPUT_TIMESTAMP"
          if [[ -z "$ts" ]]; then
            ts="$(date -u +%Y%m%d_%H%M%S)"
          fi
          service_url="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          revision="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          image="$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.template.spec.containers[0].image)')"
          expected_backend_sha="$INPUT_EXPECTED_BACKEND_SHA"
          if [[ -z "$expected_backend_sha" ]]; then
            expected_backend_sha="$GITHUB_SHA"
          fi
          if [[ ! "$expected_backend_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Error: expected_backend_sha must be a full 40-character commit SHA, got: $expected_backend_sha" >&2
            exit 2
          fi
          sha_match=false
          if [[ "$image" == *"$expected_backend_sha"* ]]; then
            sha_match=true
          fi
          echo "ALPHA_TIMESTAMP=$ts" >> "$GITHUB_ENV"
          echo "ALPHA_SMOKE_BASE_URL=${service_url:-$DEFAULT_BACKEND_URL}" >> "$GITHUB_ENV"
          echo "RAG_API_LIVE_BASE_URL=${service_url:-$DEFAULT_BACKEND_URL}" >> "$GITHUB_ENV"
          echo "ALPHA_SMOKE_CLOUD_RUN_REVISION=$revision" >> "$GITHUB_ENV"
          echo "ALPHA_SMOKE_BACKEND_SHA=$expected_backend_sha" >> "$GITHUB_ENV"
          echo "ALPHA_SMOKE_WORKFLOW_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "ALPHA_SMOKE_BACKEND_IMAGE=$image" >> "$GITHUB_ENV"
          echo "ALPHA_SMOKE_BACKEND_SHA_MATCH=$sha_match" >> "$GITHUB_ENV"
          echo "Live target: ${service_url:-$DEFAULT_BACKEND_URL}"
          echo "Revision: $revision"
          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Expected backend SHA: $expected_backend_sha"
          echo "Image: $image"
          echo "Image contains expected backend SHA: $sha_match"

          if [[ "$INPUT_REQUIRE_DEPLOYED_SHA_MATCH" == "true" && "$sha_match" != "true" ]]; then
            echo "Error: live Cloud Run image does not contain expected backend SHA $expected_backend_sha." >&2
            echo "For #571 GO proof, dispatch this workflow from the deployed backend commit, pass expected_backend_sha for harness-only reruns, or set require_deployed_sha_match=false only for harness debugging." >&2
            exit 2
          fi

      - name: Validate backend health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 "$ALPHA_SMOKE_BASE_URL/health"

      - name: V voice pipeline live preflight
        id: voice_pipeline
        if: contains(format(',{0},', inputs.suites), ',v,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        env:
          API_SECRET_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: scripts/voice-pipeline-live-preflight.sh --timestamp "${ALPHA_TIMESTAMP}-v" --host "$ALPHA_SMOKE_BASE_URL" --case-set smoke --allow-vosk-fallback

      - name: STT live preflight
        id: stt_preflight
        if: contains(format(',{0},', inputs.suites), ',stt,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        run: scripts/stt-live-preflight.sh --timestamp "${ALPHA_TIMESTAMP}-stt" --revision "$ALPHA_SMOKE_CLOUD_RUN_REVISION" --minutes 1440 --limit 1000

      - name: A voice round-trip smoke
        id: alpha_a
        if: contains(format(',{0},', inputs.suites), ',a,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        env:
          API_SECRET_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: scripts/alpha-smoke-comprehensive.sh --timestamp "${ALPHA_TIMESTAMP}-a" --host "$ALPHA_SMOKE_BASE_URL" --scenarios A --timeout 120 --sleep 3.2

      - name: B LangGraph routing live smoke
        id: alpha_b
        if: contains(format(',{0},', inputs.suites), ',b,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        env:
          API_SECRET_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: scripts/alpha-smoke-comprehensive.sh --timestamp "${ALPHA_TIMESTAMP}-b" --host "$ALPHA_SMOKE_BASE_URL" --scenarios B --timeout 120 --sleep 1

      - name: C live API RAGAS
        id: rag_api_live
        if: contains(format(',{0},', inputs.suites), ',c,') || contains(format(',{0},', inputs.suites), ',c-diag,') || contains(format(',{0},', inputs.suites), ',c-127,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        env:
          API_SECRET_KEY: ${{ secrets.BACKEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RAG_API_LIVE_OPENAI_SECRET_NAMES: OPENAI_API_KEY,openai-api-key
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          c_suite="${{ inputs.c_ragas_suite }}"
          if [[ ",${{ inputs.suites }}," == *",c-diag," ]]; then
            c_suite="diagnostic-29"
          fi
          if [[ ",${{ inputs.suites }}," == *",c-127," ]]; then
            c_suite="alpha-127"
          fi
          echo "ALPHA_C_RAGAS_SUITE=$c_suite" >> "$GITHUB_ENV"
          scripts/rag-api-live-test.sh --timestamp "${ALPHA_TIMESTAMP}-c" --case-suite "$c_suite" --languages ja,en,zh,ko

      - name: D memory and state durability smoke
        id: alpha_d
        if: contains(format(',{0},', inputs.suites), ',d,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        env:
          API_SECRET_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: scripts/alpha-smoke-comprehensive.sh --timestamp "${ALPHA_TIMESTAMP}-d" --host "$ALPHA_SMOKE_BASE_URL" --scenarios D --timeout 120 --sleep 2.2 --parallel 1

      - name: E Cloud Logging verification
        id: cloud_logging
        if: contains(format(',{0},', inputs.suites), ',e,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        run: scripts/cloud-logging-verify.sh --timestamp "${ALPHA_TIMESTAMP}-e" --minutes 240 --limit 1000

      - name: Q LangGraph answer quality gate
        id: quality_q
        if: contains(format(',{0},', inputs.suites), ',q,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        env:
          API_SECRET_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: scripts/alpha-quality-gates.sh --timestamp "${ALPHA_TIMESTAMP}-q" --host "$ALPHA_SMOKE_BASE_URL" --suites q

      - name: M STM/LTM memory quality gate
        id: quality_m
        if: contains(format(',{0},', inputs.suites), ',m,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        env:
          API_SECRET_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: scripts/alpha-quality-gates.sh --timestamp "${ALPHA_TIMESTAMP}-m" --host "$ALPHA_SMOKE_BASE_URL" --suites m

      - name: T PiperPlus answer TTS quality gate
        id: quality_t
        if: contains(format(',{0},', inputs.suites), ',t,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        env:
          API_SECRET_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: scripts/alpha-quality-gates.sh --timestamp "${ALPHA_TIMESTAMP}-t" --host "$ALPHA_SMOKE_BASE_URL" --suites t

      - name: Setup pnpm for H-UI suite
        if: contains(format(',{0},', inputs.suites), ',h-ui,') || contains(format(',{0},', inputs.suites), ',h,') || contains(format(',{0},', inputs.suites), ',all,')
        uses: pnpm/action-setup@v2
        with:
          version: 10.12.1

      - name: Setup Node for H-UI suite
        if: contains(format(',{0},', inputs.suites), ',h-ui,') || contains(format(',{0},', inputs.suites), ',h,') || contains(format(',{0},', inputs.suites), ',all,')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies for H-UI suite
        if: contains(format(',{0},', inputs.suites), ',h-ui,') || contains(format(',{0},', inputs.suites), ',h,') || contains(format(',{0},', inputs.suites), ',all,')
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser for H-UI suite
        if: contains(format(',{0},', inputs.suites), ',h-ui,') || contains(format(',{0},', inputs.suites), ',h,') || contains(format(',{0},', inputs.suites), ',all,')
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: H-UI Welcome UI live scenario (fixture audio)
        id: welcome_live
        if: contains(format(',{0},', inputs.suites), ',h-ui,') || contains(format(',{0},', inputs.suites), ',h,') || contains(format(',{0},', inputs.suites), ',all,')
        continue-on-error: true
        env:
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: scripts/welcome-live-preflight.sh --timestamp "${ALPHA_TIMESTAMP}-h" --host "$ALPHA_SMOKE_BASE_URL" --delays 0,5,10

      - name: Upload alpha compact reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-live-verification-summary-${{ github.run_id }}
          path: |
            backend/tests/reports/*.md
            backend/tests/reports/*.csv
            backend/tests/reports/*.json
            backend/tests/reports/*.log
            backend/tests/evaluation/reports/*.md
            backend/tests/evaluation/reports/*.csv
            backend/tests/evaluation/reports/*.json
            backend/tests/evaluation/reports/*.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload alpha heavy browser artifacts
        if: >-
          always() && (
            steps.stt_preflight.outcome == 'failure' ||
            steps.voice_pipeline.outcome == 'failure' ||
            steps.alpha_a.outcome == 'failure' ||
            steps.alpha_b.outcome == 'failure' ||
            steps.rag_api_live.outcome == 'failure' ||
            steps.alpha_d.outcome == 'failure' ||
            steps.cloud_logging.outcome == 'failure' ||
            steps.quality_q.outcome == 'failure' ||
            steps.quality_m.outcome == 'failure' ||
            steps.quality_t.outcome == 'failure' ||
            steps.welcome_live.outcome == 'failure'
          )
        uses: actions/upload-artifact@v4
        with:
          name: alpha-live-verification-browser-artifacts-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize outcomes
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Alpha Live Verification

          - suites: ${{ inputs.suites }}
          - c_ragas_suite_input: ${{ inputs.c_ragas_suite }}
          - c_ragas_suite_resolved: ${ALPHA_C_RAGAS_SUITE:-not-run}
          - timestamp: ${ALPHA_TIMESTAMP:-unknown}
          - backend: ${ALPHA_SMOKE_BASE_URL:-unknown}
          - revision: ${ALPHA_SMOKE_CLOUD_RUN_REVISION:-unknown}
          - workflow_sha: ${ALPHA_SMOKE_WORKFLOW_SHA:-unknown}
          - expected_backend_sha: ${ALPHA_SMOKE_BACKEND_SHA:-unknown}
          - image: ${ALPHA_SMOKE_BACKEND_IMAGE:-unknown}
          - image_expected_backend_sha_match: ${ALPHA_SMOKE_BACKEND_SHA_MATCH:-unknown}

          | Step | Outcome |
          | --- | --- |
          | stt_preflight | ${{ steps.stt_preflight.outcome }} |
          | voice_pipeline | ${{ steps.voice_pipeline.outcome }} |
          | alpha_a | ${{ steps.alpha_a.outcome }} |
          | alpha_b | ${{ steps.alpha_b.outcome }} |
          | rag_api_live | ${{ steps.rag_api_live.outcome }} |
          | alpha_d | ${{ steps.alpha_d.outcome }} |
          | cloud_logging | ${{ steps.cloud_logging.outcome }} |
          | quality_q | ${{ steps.quality_q.outcome }} |
          | quality_m | ${{ steps.quality_m.outcome }} |
          | quality_t | ${{ steps.quality_t.outcome }} |
          | welcome_live | ${{ steps.welcome_live.outcome }} |
          EOF

          ragas_report_ts="$(python - "${ALPHA_TIMESTAMP:-unknown}-c" <<'PY'
          import sys

          raw = sys.argv[1].strip()
          safe = "".join(ch if ch.isalnum() or ch in {"-", "_", "."} else "_" for ch in raw)
          print(safe or "unknown-c")
          PY
          )"
          ragas_json="backend/tests/evaluation/reports/live_api_eval_${ragas_report_ts}.json"
          if [[ -f "$ragas_json" ]]; then
            python - "$ragas_json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          summary = data.get("evaluation_summary", {})
          coverage = data.get("suite_coverage", {})
          print("")
          print("## C/RAGAS coverage")
          print("")
          print(f"- artifact: `{path}`")
          print(f"- case_suite: {data.get('case_suite', 'unknown')}")
          print(
              "- suite_cases: "
              f"requested={coverage.get('requested_total_cases', 'unknown')} "
              f"expected={coverage.get('expected_total_cases', 'unknown')} "
              f"passed={coverage.get('passed', 'unknown')}"
          )
          print(
              "- totals: "
              f"requested={summary.get('requested_total_cases', 0)} "
              f"collected={summary.get('collected_total_cases', 0)} "
              f"evaluated={summary.get('evaluated_total_cases', 0)} "
              f"collection_errors={summary.get('collection_error_total', 0)} "
              f"api_failed={summary.get('api_failed_total', 0)} "
              f"ragas_errors={summary.get('ragas_error_total', 0)}"
          )
          requested = summary.get("requested_by_language", {})
          collected = summary.get("collected_by_language", {})
          evaluated = summary.get("evaluated_by_language", {})
          errors = summary.get("collection_errors_by_language", {})
          print("")
          print("| Language | Requested | Collected | Evaluated | Collection errors |")
          print("| --- | ---: | ---: | ---: | ---: |")
          for lang in data.get("languages", []):
              print(
                  f"| {lang} | {requested.get(lang, 0)} | {collected.get(lang, 0)} | "
                  f"{evaluated.get(lang, 0)} | {errors.get(lang, 0)} |"
              )
          PY
          fi

      - name: Fail when any selected suite failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for outcome in \
            "${{ steps.stt_preflight.outcome }}" \
            "${{ steps.voice_pipeline.outcome }}" \
            "${{ steps.alpha_a.outcome }}" \
            "${{ steps.alpha_b.outcome }}" \
            "${{ steps.rag_api_live.outcome }}" \
            "${{ steps.alpha_d.outcome }}" \
            "${{ steps.cloud_logging.outcome }}" \
            "${{ steps.quality_q.outcome }}" \
            "${{ steps.quality_m.outcome }}" \
            "${{ steps.quality_t.outcome }}" \
            "${{ steps.welcome_live.outcome }}"; do
            if [[ "$outcome" == "failure" ]]; then
              failed=1
            fi
          done
          exit "$failed"
