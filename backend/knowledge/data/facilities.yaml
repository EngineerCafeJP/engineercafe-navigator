  - id: "facility-phone-meeting-guide"
    title: "エンジニアカフェ 電話・オンラインMTG可能場所"
    title_en: "Phone Call and Online Meeting Location Guide"
    content: >
      エンジニアカフェ内で電話やオンラインミーティングが可能な場所のガイドです。
      【通話OK】メインホール（1F）、談話室（1F）、テラス（1F屋外）、cafe&bar saino。
      音量には配慮をお願いします。
      【通話NG】集中スペース（B1F）は会話・電話禁止です。
      【機密会話推奨】防音室（B1F、1回1時間まで、先着順）がオンラインMTGに最適です。
      防音室が埋まっている場合はテラスが比較的プライベートな通話に適しています。
      大人数のオンラインイベントにはMTGスペース（B1F、予約優先）もご利用いただけます。
    category: "facility-info"
    tags: ["phone", "online-meeting", "location-guide", "engineer-cafe"]
    priority: 90
    source: "official"
    verified: true

  - id: "facility-av-equipment"
    title: "エンジニアカフェ AV機器・プロジェクター貸出"
    title_en: "AV Equipment and Projector Rental"
    content: >
      エンジニアカフェではイベントや発表用のAV機器を貸出しています。
      【貸出可能な機器】
      プロジェクター、スクリーン、マイク、HDMIケーブル、4Kモニターなど。
      LT会やハッカソンの発表、勉強会の画面共有などにご利用いただけます。
      操作方法がわからない場合はスタッフにお気軽にお声がけください。
      イベントでの大規模利用は事前にコミュニティマネージャーにご相談ください。
    category: "facility-info"
    tags: ["av-equipment", "projector", "microphone", "engineer-cafe"]
    priority: 60
    source: "official"
    verified: true

  - id: "facility-drinks-vending"
    title: "エンジニアカフェ 飲料・ウォーターサーバー・自動販売機"
    title_en: "Drinks, Water Server, and Vending Machines"
    content: >
      エンジニアカフェ館内にはウォーターサーバーや自動販売機は設置されていません。
      飲み物が必要な場合は以下の方法で入手できます。
      【施設内】cafe&bar saino（サイノカフェ）でドリンクを購入（平日12:00〜、土日祝11:00〜）。
      【近隣】FamilyMart天神一丁目店（徒歩2分）やローソンS天神ブリック店（徒歩3分）で購入可能。
      天神地下街方面にも自動販売機があります。
      持ち込みの飲料は蓋付き容器（ペットボトル・水筒等）であれば持ち込み可能です。
      なお、15分以内であれば一時退出して買い物に行くことも可能です。
    category: "facility-info"
    tags: ["drinks", "vending", "water", "engineer-cafe"]
    priority: 60
    source: "official"
    verified: true

  - id: "facility-laser-cutter-materials"
    title: "レーザーカッター（レーザー加工機）利用可能素材一覧"
    title_en: "Laser Cutter Approved Materials List"
    content: >
      MAKER'sスペースのレーザー加工機（trotec speedy100 C30）で加工できる素材の一覧です。
      【利用可能な素材（○）】
      アクリル板（キャスト推奨・厚さ5mmまで目安）、MDF合板、木材（桧・バルサ等）、
      紙・厚紙・段ボール、革・合皮（薄手）、フェルト・布（一部）、ゴム印用ゴム板。
      【利用禁止素材（×）】
      PVC（塩化ビニル）・塩ビ素材: 加工時に有毒な塩素ガスが発生するため絶対禁止。
      ポリカーボネート: 変色・発火のリスクあり。
      ガラス・金属: CO2レーザーでは加工不可。
      発泡スチロール: 発火・溶融のリスクあり。
      カーボンファイバー: 有害ガス発生。
      素材は原則持ち込みです。東急ハンズ福岡店やホームセンター（グッデイ等）で購入できます。
      不明な素材は加工前にスタッフへ確認してください。
    category: "facility-info"
    tags: ["laser-cutter", "materials", "makers-space", "engineer-cafe"]
    priority: 60
    source: "official"
    verified: true

  - id: "facility-seasonal-tips"
    title: "エンジニアカフェ 季節ごとの施設特徴と注意事項"
    title_en: "Seasonal Facility Tips"
    content: >
      エンジニアカフェ（赤煉瓦文化館）は1909年築の歴史的建造物のため、
      現代のオフィスビルと比べて空調効率に限界があります。季節ごとの注意事項をお伝えします。
      【夏（6月〜9月）】
      赤煉瓦造りの建物は蓄熱しやすく、特に2階や窓際は暑くなりがちです。
      エアコンは設置されていますが、建物の構造上、完全に涼しくなるまで時間がかかる場合があります。
      飲み物（蓋付き）をこまめに摂ることをおすすめします。
      地下1階は比較的涼しいため、暑さが気になる方はUnder SpaceやFocus Spaceの利用がおすすめです。
      【冬（12月〜2月）】
      暖房は設置されていますが、天井が高く暖気が上がりやすいため、1階メインホールは寒く感じることがあります。
      上着やひざ掛けの持参をおすすめします。
      地下1階は外気の影響を受けにくいため、冬でも比較的快適です。
      【梅雨（6月中旬〜7月中旬）】
      福岡は梅雨の降水量が多い地域です。折りたたみ傘の携帯をおすすめします。
      館内の湿度が高くなる場合がありますが、除湿対策は行っています。
      【エアコン調整】エアコンの温度設定はスタッフにお声がけいただければ調整可能です。
    category: "facility-info"
    tags: ["seasonal", "temperature", "tips", "engineer-cafe"]
    priority: 60
    source: "official"
    verified: true
