  - id: "facility-charger-cable"
    title: "エンジニアカフェ 充電器・ケーブル貸出"
    title_en: "Charger and Cable Rental"
    content: >
      エンジニアカフェ受付でスマートフォン用充電器やケーブルの貸出を行っています。
      USB Type-C、Lightning（iPhone用）などに対応していますが、数に限りがあります。
      長時間利用の方はご自身の充電器をお持ちいただくことをおすすめします。
      各席に電源コンセントを完備していますので、充電器をお持ちであればご利用いただけます。
    category: "facility-info"
    tags: ["charger", "cable", "rental", "engineer-cafe"]
    priority: 90
    source: "official"
