version: "1.0.0"
description: "エンジニアカフェ一般情報（概要・営業時間・料金・アクセス・連絡先等）"
entries:
  - id: "general-what-is-ec"
    title: "エンジニアカフェとは"
    title_en: "What is Engineer Cafe"
    content: >
      エンジニアカフェ（Engineer Cafe – Hacker Space Fukuoka –）は、
      福岡市の事業「エンジニアフレンドリーシティ福岡」の中核施設として
      2019年8月に開設されたエンジニアのための無料コワーキング・交流スペースです。
      福岡市中央区天神の赤煉瓦文化館（1909年築・国の重要文化財）内にあります。
      Wi-Fi、電源、作業スペースを完備し、イベント優先のスペースとして運営されています。
      イベントがない時間帯はコワーキングスペースとして自由にご利用いただけます。
      エンジニアリングに関わる方が対象で、現役エンジニアだけでなく、
      エンジニアを目指す学生やフリーランス、海外のエンジニアなども利用できます。
    content_en: >
      Engineer Cafe (Engineer Cafe – Hacker Space Fukuoka –) is a free coworking and
      community space for engineers, established in August 2019 as a core facility of
      Fukuoka City's "Engineer Friendly City" initiative.
      Located inside the historic Akarenga Bunka-kan (Red-Brick Culture Hall, built in 1909,
      a nationally designated Important Cultural Property) in Tenjin, Chuo-ku, Fukuoka.
      Equipped with Wi-Fi, power outlets, and workspace.
      Operated as an event-priority space; when no events are scheduled, freely available as
      a coworking space.
      Open to anyone involved in engineering: working engineers, aspiring students,
      freelancers, and international engineers alike.
    category: "general"
    tags: ["overview", "basic", "engineer-cafe"]
    priority: 90
    source: "official"
    verified: true

  - id: "general-hours"
    title: "エンジニアカフェ 営業時間・休館日"
    title_en: "Engineer Cafe Opening Hours"
    content: >
      エンジニアカフェの開館時間は9:00〜22:00です。
      コミュニティマネージャーへの相談受付時間は13:00〜21:00です。
      休館日は毎月最終月曜日（祝休日のときは翌平日）と、12月29日〜1月3日です。
      ゴールデンウィーク・お盆期間は通常通り開館しますが、特別告知がある場合はX(@EngineerCafeJP)で案内されます。
    content_en: >
      Engineer Cafe is open from 9:00 AM to 10:00 PM.
      Community Manager consultation hours are 1:00 PM to 9:00 PM.
      Closed on the last Monday of each month (or the next weekday if it falls on a holiday),
      and December 29 through January 3.
      Open during Golden Week and Obon as usual, but check X(@EngineerCafeJP) for special announcements.
    category: "hours"
    tags: ["hours", "schedule", "engineer-cafe"]
    priority: 90
    source: "official"
    verified: true

  - id: "general-pricing"
    title: "エンジニアカフェ 料金・利用登録"
    title_en: "Engineer Cafe Pricing, Registration, and Membership"
    content: >
      エンジニアカフェは「エンジニアフレンドリーシティ福岡」の実現を目的とした官民一体型プロジェクトで、
      現役エンジニア、エンジニアを目指す方、エンジニアリング分野に関連する業務や学習に取り組む方が対象です。
      施設・設備の利用料は無料です。ただしcafe&bar sainoの飲食と3Dプリンターのフィラメント代は有料です。
      【初回利用登録】初めて利用する場合は受付で利用登録を行います（所要時間: 約5〜10分）。
      施設の利用目的確認、飲食ルール、集中スペースでの私語禁止、15分以上の離席ルールについて説明を受けます。
      所定のWebフォームに氏名、住所、連絡先、所属コミュニティ、職業、当施設を知ったきっかけ等を入力して完了です。
      登録は来館時のみ可能で、オンライン事前登録には対応していません。登録料は無料です。
      年齢制限はありませんが、一人で安全に利用できることが条件です。身分証明書の提示は不要です。
      【2回目以降】会員番号を伝え、利用スペースを申告し、受付カードを受け取ります。
      退館時に受付カードを受付に返却してください。
      【利用制限】イベント開催も無料ですが、企業広告やヘッドハンティング目的など公共性にそぐわない利用は不可です。
    content_en: >
      Engineer Cafe is a public-private project under Fukuoka's "Engineer Friendly City" initiative.
      It is open to working engineers, aspiring engineers, and anyone in engineering-related fields.
      Membership registration and facility use are free. Only cafe&bar saino food/drinks and
      3D printer filament are paid.
      First-time registration: Complete a form at reception (5-10 min, free, no ID required).
      You will receive a briefing on facility rules (food policy, quiet zones, 15-min seat policy).
      Registration is in-person only; no online pre-registration available.
      No age limit, but you must be able to use the facility safely on your own.
      Returning visitors: Give your member number, declare your space, and take a reception card.
      Return the card at reception when leaving.
      Events are also free, but commercial advertising and headhunting activities are not permitted.
    category: "pricing"
    tags: ["pricing", "registration", "membership", "free", "engineer-cafe"]
    priority: 90
    source: "official"
    verified: true

  - id: "general-access"
    title: "エンジニアカフェ アクセス・所在地"
    title_en: "Engineer Cafe Access and Location"
    content: >
      エンジニアカフェは福岡市中央区天神1丁目15番30号、
      福岡市赤煉瓦文化館内にあります。
      地下鉄空港線「天神駅」から徒歩5分、西鉄バス「天神4丁目」下車すぐです。
      専用の駐車場・駐輪場はありません。近隣のコインパーキングや公共駐輪場をご利用ください。
      公共交通機関でのお越しをおすすめします。
    content_en: >
      Engineer Cafe is located at 1-15-30 Tenjin, Chuo-ku, Fukuoka,
      inside the Fukuoka City Akarenga Bunka-kan (Red-Brick Culture Hall).
      5-minute walk from Tenjin Station (Fukuoka City Subway Kuko Line).
      Right outside Nishitetsu Bus "Tenjin 4-chome" stop.
      No dedicated parking or bicycle parking. Please use nearby coin parking lots and public bicycle parking.
      Public transportation is recommended.
    category: "access"
    tags: ["access", "location", "address", "engineer-cafe"]
    priority: 90
    source: "official"
    verified: true

